name: CI


on:
push:
branches: [ main ]
pull_request:
branches: [ main ]


jobs:
test:
runs-on: ubuntu-latest
steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-node@v4
with:
node-version: '20'
  - run: npm ci
  - name: Create .env
run: |
  echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
  echo "LOGIN_EMAIL=${{ secrets.LOGIN_EMAIL }}" >> .env
  echo "LOGIN_PASSWORD=${{ secrets.LOGIN_PASSWORD }}" >> .env
- name: Run tests
run: npm run test:ci
  - name: Merge & Generate HTML report
run: |
  npx mochawesome-merge ./reports/*.json > mochawesome.json
  npx mochawesome-report-generator mochawesome.json -o reports/html --inline true
- name: Upload report artifact
uses: actions/upload-artifact@v4
with:
name: mochawesome-report
path: reports/html